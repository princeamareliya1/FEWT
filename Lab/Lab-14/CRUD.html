<!DOCTYPE html>
<html>
<head>
    <title>Document</title>
    <style>
        table,th,td{
            border: 2px solid black;
            border-collapse: collapse;
            padding: 8px;
        }
        </style>
</head>
<body>
    <h2>Student CRUD Example</h2>
    <form id="studentForm">
        First Name: <input type="text" id="firstName"><br>
        Last Name: <input type="text" id="lastName"><br>
        Age: <input type="number" id="age"><br>
        Roll Number: <input type="number" id="rollNumber"><br>
        <button type="button" id="addBtn">Add Student</button>
    </form>
    <h3>Student List</h3>
    <table id="studentTable">
        <thead>
            <tr>
                <th>Roll No.</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Age</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        let students = [];
        $("#addBtn").click(function() {
            students.push({
                RollNumber: $("#rollNumber").val(),
                FirstName: $("#firstName").val(),
                LastName: $("#lastName").val(),
                Age: $("#age").val()
        });
        display();
        $("#studentForm")[0].reset();
        });
        function display() {
            let tbody = $("#studentTable tbody");
            tbody.empty();
            $.each(students, function(index, student) {
                tbody.append(`
                <tr>
                    <td>${student.RollNumber}</td>
                    <td>${student.FirstName}</td>
                    <td>${student.LastName}</td>
                    <td>${student.Age}</td>
                    <td>
                        <button class="editBtn" data-index="${index}">Edit</button>
                        <button class="deleteBtn" data-index="${index}">Delete</button>
                        </td>
                        </tr>
                        `);
                    });
    }
    $(document).on("click", ".editBtn", function() {
        let index = $(this).data("index");
        let student = students[index];
        $("#rollNumber").val(student.RollNumber);
        $("#firstName").val(student.FirstName);
        $("#lastName").val(student.LastName);
        $("#age").val(student.Age);
        $("#addBtn").text("Update Student").off("click").click(function() {
            students[index] = {
                FirstName: $("#firstName").val(),
                LastName: $("#lastName").val(),
                Age: $("#age").val(),
                Semester: $("#semester").val(),
                RollNumber: $("#rollNumber").val(),
            };
            display();
            $("#studentForm")[0].reset();
            $("#addBtn").text("Add Student").off("click").click(function() {
                let student = {
                    RollNumber: $("#rollNumber").val(),
                    FirstName: $("#firstName").val(),
                    LastName: $("#lastName").val(),
                    Age: $("#age").val(),
                };
                students.push(student);
                display();
                $("#studentForm")[0].reset();
            });
        });
    });
    $(document).on("click", ".deleteBtn", function() {
        students.splice($(this).data("index"), 1);
        display();
    });
</script>
</body>
</html>
