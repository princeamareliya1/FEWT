<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table class="signup" cellpadding="2" cellspacing="5">
        <th colspan="2">Registration form</th>
        <form>
            <tr>
                <td>First Name</td>
                <td>
                    <input type="text" maxlength="32" name="firstname" required="required">
                </td>
            </tr>
            <tr>
                <td>Sure name</td>
                <td>
                    <input type="text" maxlength="32" name="surname" required="required">
                </td>
            </tr>
            <tr>
                <td>Login</td>
                <td>
                    <input type="text" maxlength="16" name="login" required="required">
                </td>
            </tr>
            <tr>
                <td>Password</td>
                <td>
                    <input type="password" maxlength="12" name="password" required="required">
                </td>
            </tr>
            <tr>
                <td>E-mail adress</td>
                <td>
                    <input type="email" maxlength="64" name="email" required="required">
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="submit">
                </td>
            </tr>
        </form>
    </table>
    <script>
        
    </script>
</body>
</html>
