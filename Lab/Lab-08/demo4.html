<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <table class="signup" cellpadding="2" cellspacing="5">
            <td><label for="surname">Surname</label></td>
            <td>
                <input type="text" id="surname" maxlength="32" name="surname" required>
            </td>

            <td><label for="login">Login</label></td>
            <td>
                <input type="text" id="login" maxlength="16" name="login" required>
            </td>

            <td><label for="password">Password</label></td>
            <td>
                <input type="password" id="password" maxlength="12" name="password" required>
            </td>

            <td><label for="email">E-mail address</label></td>
            <td>
                <input type="email" id="email" maxlength="64" name="email" required>
            </td>
        </table>
    </form>
    <script>

    </script>
</body>

</html>
