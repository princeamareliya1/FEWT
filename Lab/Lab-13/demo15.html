<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Quibusdam enim reprehenderit impedit, quod incidunt aliquid sed odio ipsa recusandae sint nam natus veritatis tempora consequatur perferendis odit, neque error ratione.</p>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $("p").mouseover(function(){
            $(this).css("background-color","red");
        });
        $("p").mouseout(function(){
            $(this).css("background-color","white");
        });
    </script>
</body>
</html>
