<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        student = { name: "prince", dob: "01/01/2026", enr: "25010101007" }
        copy = { ...student }
        const { name: stdname, dob: date, enr: number } = student;
        for (ele in copy) {
            document.write(ele + " : " + copy[ele] + "</br>");
        }
        document.write(stdname + "</br>");
        document.write(date + "</br>");
        document.write(number + "</br>");

        arr = [1, 2, 3, 4, 5, 6];
        copy = [...arr];
        [a, b, , ...other] = copy;
        document.write(copy + "<br/>");
        document.write(a + "<br/>");
        document.write(b + "<br/>");
        document.write(other + "<br/>");
    </script>
</body>

</html>
