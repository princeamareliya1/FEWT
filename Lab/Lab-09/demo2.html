<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1><u>var : global variable</u></h1>
    <h1><u>let : local variable</u></h1>
    <script>
        let a=10;
        var b=20;
        {
            let a = 15;
            var b = 25;
            document.write("Inside the function="+a+" "+b+"<br/>");
        }
        document.write(a+" "+b);
    </script>
</body>

</html>
